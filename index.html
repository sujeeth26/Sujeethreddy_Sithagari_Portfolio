<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sujeeth Sithagari | AI Engineer</title>

  <!-- AOS Animation -->
  <link
    href="https://unpkg.com/aos@2.3.1/dist/aos.css"
    rel="stylesheet"
  >

  <!-- Font Awesome -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
      background: #f5f7fa;
      color: #333;
    }

    header,
    section,
    footer {
      max-width: 1100px;
      margin: auto;
    }

    /* =========================
       NAVIGATION
    ========================= */

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: #111827;
      padding: 14px 0;
      z-index: 999;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }

    nav a:hover {
      color: #60a5fa;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 110px 20px 70px;
    }

    header img {
      border-radius: 50%;
      width: 155px;
      height: 155px;
      object-fit: cover;
      margin-bottom: 20px;
      border: 4px solid #374151;
    }

    h1 {
      margin: 0;
      font-size: 2.6rem;
    }

    .tagline {
      font-size: 1.15rem;
      margin: 12px auto 20px;
      color: #d1d5db;
      max-width: 800px;
    }

    .header-description {
      max-width: 800px;
      margin: 0 auto 25px;
      color: #cbd5e1;
    }

    .socials {
      margin-top: 20px;
    }

    .socials a {
      display: inline-block;
      margin: 5px 8px;
      padding: 8px 14px;
      border: 1px solid #4b5563;
      border-radius: 5px;
      color: white;
      text-decoration: none;
      transition: 0.3s;
    }

    .socials a:hover {
      background: #2563eb;
      border-color: #2563eb;
    }

    /* =========================
       SECTIONS
    ========================= */

    section {
      background: white;
      margin-top: 25px;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    h2 {
      color: #111827;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 10px;
      margin-bottom: 25px;
    }

    h3 {
      color: #1f2937;
    }

    a {
      color: #2563eb;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* =========================
       ABOUT
    ========================= */

    .about-highlight {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 25px;
    }

    .highlight-card {
      background: #f8fafc;
      border-left: 4px solid #2563eb;
      padding: 18px;
      border-radius: 6px;
    }

    .highlight-card strong {
      display: block;
      margin-bottom: 5px;
      color: #111827;
    }

    /* =========================
       SKILLS
    ========================= */

    .skills-columns {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .skills-column {
      background: #f8fafc;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }

    .skills-column h3 {
      margin-top: 0;
    }

    ul {
      padding-left: 0;
      list-style: none;
    }

    .skills-column li {
      margin-bottom: 10px;
    }

    .skills-column li i {
      margin-right: 8px;
      color: #2563eb;
      width: 18px;
    }

    /* =========================
       EXPERIENCE
    ========================= */

    .experience-item {
      margin-bottom: 35px;
      padding-bottom: 25px;
      border-bottom: 1px solid #e5e7eb;
    }

    .experience-item:last-child {
      border-bottom: none;
    }

    .experience-header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .experience-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: #111827;
    }

    .experience-date {
      color: #6b7280;
      font-weight: bold;
    }

    .experience-item ul {
      list-style: disc;
      padding-left: 22px;
    }

    .experience-item li {
      margin-bottom: 10px;
    }

    /* =========================
       PROJECTS
    ========================= */

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
    }

    .project {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 22px;
      background: #fafafa;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .project:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
    }

    .project h3 {
      margin-top: 0;
    }

    .project-tools {
      font-size: 0.9rem;
      color: #2563eb;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .project-link {
      display: inline-block;
      margin-top: 10px;
      font-weight: bold;
    }

    /* =========================
       EDUCATION
    ========================= */

    .education-item {
      margin-bottom: 25px;
      padding: 20px;
      background: #f8fafc;
      border-radius: 8px;
      border-left: 4px solid #2563eb;
    }

    .education-item h3 {
      margin-top: 0;
    }

    .education-date {
      color: #6b7280;
    }

    /* =========================
       CERTIFICATIONS
    ========================= */

    .certifications {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .certification-card {
      padding: 20px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }

    .certification-card i {
      color: #2563eb;
      font-size: 1.4rem;
      margin-right: 10px;
    }

    /* =========================
       CONTACT
    ========================= */

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .contact-card {
      padding: 20px;
      background: #f8fafc;
      border-radius: 8px;
    }

    .contact-card i {
      color: #2563eb;
      margin-right: 8px;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      margin-top: 40px;
      background: #111827;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    footer a {
      color: #d1d5db;
      margin: 0 10px;
      text-decoration: none;
    }

    footer a:hover {
      color: white;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 768px) {
      nav {
        padding: 10px 0;
      }

      nav a {
        margin: 0 7px;
        font-size: 12px;
      }

      header {
        padding-top: 100px;
      }

      h1 {
        font-size: 2rem;
      }

      .tagline {
        font-size: 1rem;
      }

      section {
        margin: 15px;
        padding: 22px;
      }

      .experience-header {
        display: block;
      }

      .experience-date {
        margin-top: 5px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       NAVIGATION
  ========================= -->

  <nav>
    <a href="#about">About</a>
    <a href="#skills">Skills</a>
    <a href="#experience">Experience</a>
    <a href="#projects">Projects</a>
    <a href="#education">Education</a>
    <a href="#contact">Contact</a>
  </nav>


  <!-- =========================
       HERO
  ========================= -->

  <header>

    <img
      src="profile.jpg"
      alt="Sujeeth Sithagari"
    >

    <h1>Sujeeth Sithagari</h1>

    <div class="tagline">
      AI Engineer | Generative AI | Agentic AI | Backend Engineering
    </div>
